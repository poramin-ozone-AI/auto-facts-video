name: daily-video

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 เวลาไทย (GitHub ใช้ UTC และอาจล่าช้า 5-30 นาที)
  workflow_dispatch:          # กดรันเองเพื่อทดสอบ
    inputs:
      test_mode:
        description: "โหมดทดสอบ: เขียนบท + สร้างเสียง 2 บท + สร้างภาพ 2 ฉาก + เรนเดอร์ตัวอย่าง 2 ฉากพร้อมซับ (test_output.mp4) ไม่บันทึกหัวข้อ เอาเครื่องหมายถูกออกเพื่อรันเต็ม"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      # --- Secrets ---
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # --- ตัวแปรปรับแต่ง (แก้ค่าตรงนี้ได้เลย; ถ้าลบบรรทัดไหน จะใช้ค่าเริ่มต้นในโค้ด) ---
      GEMINI_MODEL: "gemini-3.8-flash"
      GEMINI_FALLBACK_MODELS: "gemini-3.6-flash,gemini-3.5-flash-lite"
      GROQ_MODEL: "openai/gpt-oss-120b"
      GEMINI_TTS_MODEL: "gemini-3.8-flash-tts"
      GEMINI_TTS_FALLBACK_MODELS: ""   # เว้นว่าง: รุ่น lite ไม่รองรับภาษาไทย ถ้า 3.8 ใช้ไม่ได้ให้ใช้ edge-tts
      GEMINI_VOICE: "Orus"
      GEMINI_TTS_DELAY: "31"
      EDGE_VOICE: "th-TH-NiwatNeural"
      VOICE_RATE: "+0%"       # เสียงสำรอง edge-tts (v3.7 ปรับจาก -8% ให้ใกล้ Gemini ที่เร็วขึ้น ปรับได้หลังฟังจริง)
      VOICE_PITCH: "-2Hz"
      SCRIPT_MIN_CHARS: "520"   # ความยาวบทพากย์รวมขั้นต่ำ/สูงสุด (ตัวอักษร) ถ้าคลิปสั้นเกินให้ขยับ MIN ขึ้น
      SCRIPT_MAX_CHARS: "1250"
      VOICE_DIRECTIONS_ENABLED: "curious,informative,excited,mysterious,emphatic,warm"   # ตัดอารมณ์ที่ฟังแล้วไม่ต่างออกได้
      AUDIO_TAIL_PAD: "0.4"   # เว้นความเงียบท้ายเสียงแต่ละฉาก (วินาที)
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      CF_IMAGE_FALLBACK_MODELS: "@cf/black-forest-labs/flux-1-schnell"
      CF_IMAGE_STEPS: "6"
      IMAGE_DETAIL_LEVEL: "rich"   # v3.8: rich = ภาพละเอียด มีคน/ฉากหน้า-หลัง/ของประกอบ, standard = ปานกลาง (ใช้ถ้าภาพแน่นเกินหรือโมเดลทำตาม prompt ไม่ครบ)
      ENABLE_POLLINATIONS: "1"
      SUBTITLES_ENABLED: "1"            # v3.9: ซับเบิร์นลงวิดีโอ + output/subtitles.srt (0 = ปิด)
      SUBTITLE_KEYWORDS_ENABLED: "1"    # คำสำคัญสีเหลือง (0 = ซับขาวล้วน และไม่ขอ keywords จาก AI)
      SUBTITLE_FONT: "Loma"             # ฟอนต์ไทย (ติดตั้งจาก fonts-thai-tlwg ในขั้นติดตั้ง)
      SUBTITLE_FONT_SIZE: "54"
      SUBTITLE_MAX_CHARS: "22"          # ตัวอักษรสูงสุดต่อท่อน (บรรทัดเดียว)
      SUBTITLE_MARGIN_BOTTOM: "230"     # ระยะจากขอบล่าง (~18% ของ 1280) เลี่ยงปุ่ม Shorts/TikTok
      SUBTITLE_HIGHLIGHT_COLOR: "#FFD93B"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-thai-tlwg fontconfig
          pip install -r requirements.txt

      - name: 0) Check model names (เตือนอย่างเดียว ไม่ทำให้ล้ม)
        continue-on-error: true
        run: python scripts/0_check_models.py

      - name: 1) Generate Script
        run: python scripts/1_generate_script.py

      - name: 2) Generate Voice
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/2_generate_voice.py --test
          else
            python scripts/2_generate_voice.py
          fi

      - name: 3) Generate Images
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/3_generate_images.py --test
          else
            python scripts/3_generate_images.py
          fi

      - name: 4) Render Video
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/4_render_video.py --test
          else
            python scripts/4_render_video.py
          fi

      - name: Upload final video & script artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            output/output.mp4
            output/subtitles.srt
            output/script.json
          retention-days: 14

      # บันทึกหัวข้อเฉพาะเมื่อคลิปเรนเดอร์สำเร็จและอัปโหลดแล้วเท่านั้น (รันล้มเหลว = หัวข้อไม่ถูกนับว่าใช้แล้ว)
      - name: 5) Save topic history to repository
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode != 'true') }}
        run: |
          python scripts/5_save_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/topics_history.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update topics history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload test or debug artifacts
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-or-test-${{ github.run_number }}
          path: |
            output/script.json
            output/audio/*.mp3
            output/images/scene_*.png
            output/test_output.mp4
            output/output.mp4
            output/subtitles.srt
            output/subs/*.ass
          retention-days: 7
          if-no-files-found: ignore
