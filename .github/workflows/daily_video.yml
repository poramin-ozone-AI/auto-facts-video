name: daily-video

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 เวลาไทย (GitHub ใช้ UTC และอาจล่าช้า 5-30 นาที)
  workflow_dispatch:          # กดรันเองเพื่อทดสอบ
    inputs:
      test_mode:
        description: "โหมดทดสอบ: เขียนบท + สร้างเสียง/ภาพตัวอย่าง + เรนเดอร์ test_output.mp4 ไม่บันทึกหัวข้อ เอาเครื่องหมายถูกออกเพื่อรันเต็ม"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      # --- Secrets ---
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # --- ตัวแปรปรับแต่ง (แก้ค่าตรงนี้ได้เลย; ถ้าลบบรรทัดไหน จะใช้ค่าเริ่มต้นในโค้ด) ---
      GEMINI_MODEL: "gemini-3.8-flash"
      GEMINI_FALLBACK_MODELS: "gemini-3.6-flash,gemini-3.5-flash-lite"
      GROQ_MODEL: "openai/gpt-oss-120b"
      GEMINI_TTS_MODEL: "gemini-3.8-flash-tts"
      GEMINI_TTS_FALLBACK_MODELS: ""   # เว้นว่าง: รุ่น lite ไม่รองรับภาษาไทย ถ้า 3.8 ใช้ไม่ได้ให้ใช้ edge-tts
      GEMINI_VOICE: "Orus"
      GEMINI_TTS_DELAY: "31"
      EDGE_VOICE: "th-TH-NiwatNeural"
      VOICE_RATE: "+0%"       # เสียงสำรอง edge-tts (v3.7 ปรับจาก -8% ให้ใกล้ Gemini ที่เร็วขึ้น ปรับได้หลังฟังจริง)
      VOICE_PITCH: "-2Hz"
      SCRIPT_TEMPERATURE: "0.65"
      AUDIO_TAIL_PAD: "0.2"
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      IMAGE_MAX_ATTEMPTS: "5"           # v4.4: ไม่มีโมเดลสำรอง Klein ล้มเหลวจริง = รันนั้นล้ม จึง retry หลายรอบ (error ทั่วไปต่อฉาก)
      IMAGE_RATE_LIMIT_RETRIES: "4"     # จำนวนครั้งที่รอแล้วลองใหม่เมื่อเจอ 429
      IMAGE_RATE_LIMIT_WAIT: "60"       # วินาทีรอ 429 ครั้งแรก (ครั้งถัดไปรอ 2x, 3x, ... สูงสุด 300)
      IMAGE_DETAIL_LEVEL: "rich"   # rich = รายละเอียดและมิติเมื่อเหมาะสม; standard = องค์ประกอบเรียบง่าย; ทั้งคู่ไม่บังคับจำนวนรายละเอียด
      CHARACTERS_ENABLED: "1"           # v4.7: ตัวละครประจำคลิป OZONE + ORBI (ภาพอ้างอิงใน assets/characters/) ตั้ง "0" เพื่อปิดทั้งระบบ
      CHAR_REF_MAX_SIDE: "480"          # v4.7: ด้านยาวสุดของภาพอ้างอิง (พิกเซล) เอกสาร Cloudflare จำกัดภาพอ้างอิง < 512x512
      CHAR_REF_BG: "white"              # v4.7: พื้นหลังที่แปะใต้ภาพอ้างอิงโปร่งใส (white | cream | black) ยังไม่ยืนยันว่า Cloudflare ตีความช่องโปร่งใสอย่างไร จึงแปะพื้นให้เอง
      HOOK_MAX_CHARS: "60"              # v4.8: ความยาวสูงสุดของคำถามฮุกฉากที่ 1 (ตัวอักษร) ราว 4-5 วินาที
      SUBTITLES_ENABLED: "1"            # v3.9: ซับเบิร์นลงวิดีโอ + output/subtitles.srt (0 = ปิด)
      SUBTITLE_KEYWORDS_ENABLED: "1"    # คำสำคัญสีเหลือง (0 = ซับขาวล้วน และไม่ขอ keywords จาก AI)
      SUBTITLE_FONT: "Loma"             # ฟอนต์ไทย (ติดตั้งจาก fonts-thai-tlwg ในขั้นติดตั้ง)
      SUBTITLE_FONT_SIZE: "96"
      SUBTITLE_MAX_CHARS: "22"          # ตัวอักษรสูงสุดต่อท่อน (บรรทัดเดียว)
      SUBTITLE_MARGIN_BOTTOM: "345"     # ระยะจากขอบล่าง (~18% ของ 1920) เลี่ยงปุ่ม Shorts/TikTok
      SUBTITLE_HIGHLIGHT_COLOR: "#FFD93B"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-thai-tlwg fontconfig
          pip install -r requirements.txt

      - name: Restore topic history (duplicate-topic protection)
        uses: actions/cache/restore@v4
        with:
          path: output/topics_history.txt
          key: topics-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            topics-history-

      - name: 0) Check model names (เตือนอย่างเดียว ไม่ทำให้ล้ม)
        continue-on-error: true
        run: python scripts/0_check_models.py

      - name: 1) Generate Script
        run: python scripts/1_generate_script.py

      - name: 2) Generate Voice
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/2_generate_voice.py --test
          else
            python scripts/2_generate_voice.py
          fi

      - name: 3) Generate Images
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/3_generate_images.py --test
          else
            python scripts/3_generate_images.py
          fi

      - name: 4) Render Video
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/4_render_video.py --test
          else
            python scripts/4_render_video.py
          fi

      - name: 6) Final quality check
        run: python scripts/6_quality_check.py $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ] && echo output/test_output.mp4 || echo output/output.mp4)

      - name: Upload final video & script artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            output/output.mp4
            output/subtitles.srt
            output/post_info.txt
            output/script.json
          retention-days: 14

      # เก็บประวัติหัวข้อไว้ใน Actions cache เพื่อป้องกันหัวข้อซ้ำ โดยไม่เขียนหรือ push กลับ Repository
      - name: 5) Save topic history to cache
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode != 'true') }}
        run: python scripts/5_save_history.py

      - name: Persist topic history cache
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_mode != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: output/topics_history.txt
          key: topics-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test or debug artifacts
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-or-test-${{ github.run_number }}
          path: |
            output/script.json
            output/audio/*.mp3
            output/images/scene_*.png
            output/test_output.mp4
            output/output.mp4
            output/subtitles.srt
            output/post_info.txt
            output/subs/*.ass
          retention-days: 7
          if-no-files-found: ignore
