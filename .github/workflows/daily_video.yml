name: daily-video

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 08:00 เวลาไทย (GitHub ใช้ UTC และอาจล่าช้า 5-30 นาที)
  workflow_dispatch:          # กดรันเองเพื่อทดสอบ
    inputs:
      test_images:
        description: "โหมดทดสอบ: สร้างภาพแค่ 2 ฉากและข้ามการเรนเดอร์คลิปเต็ม (ไม่บันทึกหัวข้อ)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      # --- Secrets ---
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # --- ตัวแปรปรับแต่ง (แก้ค่าตรงนี้ได้เลย; ถ้าลบบรรทัดไหน จะใช้ค่าเริ่มต้นในโค้ด) ---
      GEMINI_MODEL: "gemini-2.5-flash"
      GEMINI_FALLBACK_MODELS: "gemini-3.6-flash,gemini-2.5-flash-lite"
      GROQ_MODEL: "openai/gpt-oss-120b"
      GEMINI_TTS_MODEL: "gemini-3.1-flash-tts-preview"
      GEMINI_TTS_FALLBACK_MODELS: "gemini-2.5-flash-preview-tts"
      GEMINI_VOICE: "Orus"
      GEMINI_TTS_DELAY: "31"
      EDGE_VOICE: "th-TH-NiwatNeural"
      VOICE_RATE: "-8%"
      VOICE_PITCH: "-2Hz"
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CF_IMAGE_FALLBACK_MODELS: "@cf/bytedance/stable-diffusion-xl-lightning"
      CF_IMAGE_STEPS: "6"
      ENABLE_POLLINATIONS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: 1) Generate Script
        run: python scripts/1_generate_script.py

      - name: 2) Generate Voice
        run: python scripts/2_generate_voice.py

      - name: 3) Generate Images
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_images }}" = "true" ]; then
            python scripts/3_generate_images.py --test
          else
            python scripts/3_generate_images.py
          fi

      - name: 4) Render Video
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_images != 'true' }}
        run: python scripts/4_render_video.py

      - name: Upload final video & script artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_images != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            output/output.mp4
            output/script.json
          retention-days: 14

      # บันทึกหัวข้อเฉพาะเมื่อคลิปเรนเดอร์สำเร็จและอัปโหลดแล้วเท่านั้น (รันล้มเหลว = หัวข้อไม่ถูกนับว่าใช้แล้ว)
      - name: 5) Save topic history to repository
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test_images != 'true') }}
        run: |
          python scripts/5_save_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/topics_history.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update topics history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload test or debug artifacts
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_images == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-or-test-${{ github.run_number }}
          path: |
            output/script.json
            output/audio/*.mp3
            output/images/scene_*.png
            output/output.mp4
          retention-days: 7
          if-no-files-found: ignore
